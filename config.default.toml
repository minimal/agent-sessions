# agent-sessions configuration.
#
# Each style section accepts:
#   fg, bg                 colour: an ANSI/256 number ("0"-"255") or hex ("#rrggbb")
#   bold, faint, reverse   boolean attributes
# Omitted keys keep their defaults.
#
# The column defaults below use ANSI base colours ("1"-"15"), which resolve
# through your terminal's palette — so a theme like Catppuccin colours the app
# to match. Use "#rrggbb" hex instead to pin exact colours regardless of theme.
# A Catppuccin Mocha example is at the bottom of this file.

# false (default): a key-bound command (see [commands]) takes over the terminal
# while it runs, so interactive commands work (an editor, claude --resume). This
# briefly exits the alt-screen, so the app appears to close and reopen. true:
# run commands detached, without touching the terminal — no flash — which suits
# the default bindings (they only orchestrate tmux: switch a client, open a
# window, send keys) but breaks any command that needs the terminal for input
# or output. Applies to every key-bound command.
background = false

[styles.running]   # sessions whose turn is in progress
fg = "10"
bold = true

[styles.waiting]   # sessions blocked on the user, e.g. a permission prompt
fg = "3"
bold = true

[styles.idle]      # sessions waiting for the next prompt
fg = "6"

[styles.unread]    # sessions that finished a turn you haven't opened yet
fg = "208"
bold = true

[styles.offline]   # sessions with no running claude process
faint = true

[styles.dimmed]    # sessions with no activity for over a day
faint = true

[styles.bar]       # the help and status bars
reverse = true

[styles.selected]  # the cursor row
reverse = true
# With [selection] colors = true, reverse is ignored and this section's bg
# (below, commented) is used as the highlight instead, keeping each column's
# own colour. A dim default is used if no bg is set.
# bg = "236"

[circleci]
# With a token (set here or via $CIRCLECI_TOKEN / $CIRCLE_TOKEN), the
# index gains a column showing the latest CircleCI status of each
# session's branch: pass, fail, run, hold, or - when the branch has no
# pipelines. The project slug is derived from the git origin remote
# (github.com/org/repo -> gh/org/repo); override it per project
# directory when that's wrong:
#   [circleci.projects]
#   "~/Projects/foo" = "gh/acme/foo"
token = ""

[styles.preview]  # the last-message text shown per session
faint = true

[styles.index]     # the leading row number
fg = "8"

[styles.time]      # the last-activity timestamp
fg = "8"

[styles.project]   # the directory column
fg = "4"

[styles.branch]    # the git branch column
fg = "5"

[styles.subject]   # the session title column (left unset = default text colour)

[icons]
# Glyphs shown before the directory and branch columns. Defaults are Nerd Font
# icons (need a Nerd Font in your terminal); set either to "" to hide it, or a
# plain char / emoji instead, e.g. dir = "📁".
dir    = ""   # nf-fa-folder
branch = ""   # nf-pl-branch

[display]
# "full" shows the whole path (e.g. ~/code/scratch/agent-sessions); "name"
# shows just the final segment (agent-sessions). Search still matches the
# full path either way.
project = "full"

[columns]
# Width bounds for each column. The "content" columns (dir, branch, pane,
# title) size to the longest value across visible sessions, clamped
# between min and max. The "last" column uses the config directly -- last
# messages are always long, so the bound is the column width.
#
# Set max = 0 to hide the column entirely. Setting min = max pins the
# column to a fixed width, restoring the old behaviour.
dir    = { min = 8,  max = 28 }   # the project column
branch = { min = 8,  max = 24 }   # the git branch column
pane   = { min = 0,  max = 12 }   # the tmux pane; min=0 lets it collapse
title  = { min = 0,  max = 30 }   # the session title (cap in preview "column" mode)
last   = { min = 0,  max = 100 }  # the last message (preview "column" mode only)

[sort]
# How to order the index: a comma-separated list of dimensions, most
# significant first. Recency (newest activity, live floated up) is always the
# final tie-breaker, so an empty or unknown value gives that plain order.
#   active   live sessions (a running claude process) ahead of the rest.
#   repo     cluster every session of a git repo — across all its worktrees —
#            into one block, repos ordered live-first then by recency.
# The order of the two is what matters:
#   "repo"         whole repos stay together, live-first inside each block. A
#                  repo with many finished sessions can push another repo's live
#                  session far down the list.
#   "active,repo"  every live session first (grouped by repo), then everything
#                  finished — so a busy repo's backlog never buries another
#                  repo's active work.
#   "activity"     (default) newest first, live floated to the top.
group = "activity"

[filter]
# false (default) shows every session on start. true begins with the "only
# running" filter already applied, same as pressing 'o'.
running = false

[git]
# An optional per-repo coloured glyph, drawn just before the branch column, that
# gives each git repo (shared across its worktrees) a consistent colour — handy
# alongside [sort] group = "repo". The branch text is tinted the same colour, so
# the whole git area reads as one colour-coded unit per repo (overriding
# [styles.branch] fg while enabled). Empty (default) hides it; set a glyph to
# enable, e.g. icon = "" (nf-fa-git) or a plain "•".
icon = ""
# Palette cycled for that glyph. A repo's colour is picked by hashing its path,
# so it stays put across runs. Unset uses a built-in theme-following palette.
# colors = ["2", "3", "4", "5", "6", "10", "12", "13", "14", "208"]

[selection]
# false (default) draws the cursor row in clean, mutt-style reverse video,
# which drops the row's colours. true keeps each column's colour and the
# running/waiting bold, drawing a background highlight instead (colour from
# [styles.selected] bg, or a dim default). Pressing Enter hides the highlight
# until the next keystroke or when the window regains focus, so the row you
# were reading isn't masked while you look at the session you opened.
colors = false
# With colors = false (reverse video), statuscolor = true keeps just the status
# marker and the running/idle/waiting word in their own colour (so the spinner
# and state word stay coloured on the cursor row) while the rest stays reverse.
statuscolor = false
# The status text on the reversed row uses each status's normal colour. Those
# are tuned for the dark rows, so on the pale reversed bar they can look a touch
# light; override them here with colours picked for that background (unset = use
# the normal colour). On a light terminal theme the reversed bar is dark, so you
# might instead want brighter values here.
# [selection.statuscolors]
# running = "2"     # darker green
# waiting = "3"
# idle    = "4"
# unread  = "166"   # darker orange

[status]
# Marker shown at the start of each row for its status. Defaults are Nerd
# Font icons (need a Nerd Font in your terminal). For a plain terminal use
# dots:   running="●" waiting="●" idle="·" unread="●" offline=" "
# or emoji: running="🟢" waiting="🟡" idle="⚪" unread="🟠" offline=" "
# running = "spinner" animates a braille spinner instead of a static glyph.
running = "spinner"
waiting = ""
idle    = "·"
unread  = ""
offline = " "
# Show the state word (running/waiting/idle) next to the glyph. Set false for
# a compact, icon-only column.
words = true

[preview]
# How to show each session's last assistant message. mode is "row" (a
# detail line beneath the session), "column" (an inline column), or "off".
mode = "row"
recent = 5      # in row mode, always preview this many recent sessions...
within = "20m"  # ...modified within this window (a Go duration)

[tmux]
# Marker shown next to live sessions running inside a tmux pane, i.e. the
# ones the default Enter command can jump to. Set to "" to hide it.
glyph = "⊟"

[mouse]
# Off by default. When enabled the app captures mouse events, which means the
# terminal (and tmux) hand ALL mouse input to the app: your terminal's own
# text selection, scrollback and tmux mouse mode stop working while it runs.
# In most terminals you can hold Shift (Option in some macOS terminals) to
# bypass this and select/copy text normally. Leave it off to keep tmux mouse
# behaviour untouched.
enabled = false
# When enabled, how a left click on a session row behaves:
#   "select"        (default) a single click selects the row; double-click
#                   switches to it (runs the enter command).
#   "select-switch" a single click selects the row and switches at once.
# The scroll wheel always moves the selection.
click_action = "select"

[commands]
# Shell commands bound to keys, run on the selected session. Keys are
# Bubble Tea key names: single characters ("o", "D"), "enter", or combos
# like "ctrl+x" and "f5" (quote names with + or . in them). {id}, {pid},
# {cwd}, {file} and {pane} expand to shell-quoted values; {pane} is the
# tmux pane hosting the session's claude process, and commands using it
# are only run for sessions found in a pane. Two placeholders are
# interactive and resolve before the command runs: {project-picker} opens
# a selection screen over every known project and expands to the chosen
# project's path, and {text-input} (or {text-input:Some label}) asks for
# a line of text. Bindings here take precedence over the built-in keys;
# set one to "" to unbind it.
#
# Appending ? makes a gated placeholder optional: {pane?} and {pid?}
# expand to an empty string instead of preventing the command from
# running, so one command (or a script it calls, e.g.
# open-session {state} {pane?} {cwd} {id}) can branch on it.
#
# More examples:
#   o = "cd {cwd} && $EDITOR ."
#   t = "less +G {file}"
#   n = "cd {project-picker} && claude"
#   b = "xdg-open {ci-build-url}"   # open on macOS; needs [circleci]

# If the session is running in a tmux pane, jump to it: switch-client
# moves the client when run inside tmux, attach-session takes over the
# terminal when run outside it. Otherwise resume the session in a fresh
# tmux window: the window starts an interactive shell — so your usual
# environment setup (rc files, version managers like asdf, per-directory
# tools like direnv, ...) applies — and the claude command is typed into it.
enter = '''
if [ -n {pane?} ]; then
    tmux select-pane -t {pane?} && tmux select-window -t {pane?}
    tmux switch-client -t {pane?} 2>/dev/null || tmux attach-session -t {pane?}
else
    p=$(tmux new-window -P -F "#{pane_id}" -c {cwd})
    tmux send-keys -t "$p" "claude --resume {id}" Enter
fi
'''

# New claude in a fresh tmux window: pick a project, type the first
# prompt. As with enter, the window starts an interactive shell and the
# claude command is typed into it.
c = '''
p=$(tmux new-window -P -F "#{pane_id}" -c {project-picker})
tmux send-keys -t "$p" "claude {text-input:Prompt}" Enter
'''

# Which session sources to load. Each is a sub-table; an omitted section keeps
# the default below (enabled). Disable one with enabled = false. An optional
# `enter` per source overrides the [commands] "enter" binding for that source's
# sessions (resume syntax differs: claude --resume vs pi --session). Adding a
# future source means adding a [sources.<name>] section here plus its adapter.
[sources.claude]
enabled = true
[sources.pi]
enabled = true
# session_dir = ""   # override; empty = $PI_CODING_AGENT_SESSION_DIR or ~/.pi/agent/sessions
# Jump to pi's pane (authoritative with the agent-sessions-pi-live extension,
# else cwd-match), or resume the session in the current terminal if it has no
# visible tmux pane.
enter = "tmux select-pane -t {pane} && tmux select-window -t {pane} && tmux switch-client -t {pane} 2>/dev/null || (cd {cwd} && pi --session {id})"

# --- Catppuccin Mocha example -------------------------------------------------
# The ANSI-base defaults above already follow your terminal theme. To pin exact
# Catppuccin Mocha colours regardless of terminal palette, replace the style
# sections with hex, e.g.:
#
#   [styles.running]  fg = "#a6e3a1"  bold = true   # green
#   [styles.waiting]  fg = "#f9e2af"  bold = true   # yellow
#   [styles.idle]     fg = "#89dceb"                # sky
#   [styles.unread]   fg = "#fab387"  bold = true   # peach
#   [styles.index]    fg = "#6c7086"                # overlay0
#   [styles.time]     fg = "#6c7086"                # overlay0
#   [styles.project]  fg = "#89b4fa"                # blue
#   [styles.branch]   fg = "#cba6f7"                # mauve
#   [styles.subject]  fg = "#cdd6f4"                # text
#   [styles.preview]  fg = "#9399b2"                # overlay2
